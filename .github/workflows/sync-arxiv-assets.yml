name: Sync arXiv assets

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-arxiv-assets.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out arXiv repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download paper assets from the source repository
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets figures
          base="https://raw.githubusercontent.com/fengnian123/DR-AgentOS/main"
          files=(
            "assets/Optimistic.ttf"
            "assets/optimistic.tfm"
            "assets/github-logo.pdf"
            "figures/overview.pdf"
            "figures/method.pdf"
            "figures/P4D_Benchmark.pdf"
            "figures/dataset-generate.pdf"
            "figures/P4D_CaseStudy.pdf"
            "figures/core_component_ablation_grouped.pdf"
            "figures/EvolvingWorldNav.pdf"
            "figures/Agent_Evidence_Update.pdf"
            "figures/predictive-memory.pdf"
            "figures/behavior_shift_trace_grounding.pdf"
            "figures/routine_vs_random_temporal_heatmaps.pdf"
            "figures/Real_World_Case_third_1.pdf"
            "figures/Real_World_Case_third_2.pdf"
            "figures/Real_World_Case_third_3.pdf"
            "figures/Real_World_Case_1.pdf"
            "figures/Real_World_Case_2.pdf"
          )
          for f in "${files[@]}"; do
            echo "Fetching $f"
            curl -fL --retry 3 --retry-delay 2 "$base/$f" -o "$f"
            test -s "$f"
          done

      - name: Verify required source files
        shell: bash
        run: |
          set -euo pipefail
          test -s main.tex
          test -s main.bib
          test -s fairmeta.cls
          for f in sections/*.tex; do test -s "$f"; done
          for f in figures/*.pdf; do test -s "$f"; done

      - name: Commit synced assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets figures
          if git diff --cached --quiet; then
            echo "Assets already synchronized."
            exit 0
          fi
          git commit -m "Sync full-resolution paper assets"
          git push
